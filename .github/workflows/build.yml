name: Build and release

on:
  push:
    branches: ['**']
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2022
            command: ./scripts/build_ci_windows.ps1
          - platform: Linux x64
            runner: ubuntu-24.04
            command: |
              sudo apt-get update
              sudo apt-get install -y ninja-build pkg-config libssl-dev libx11-dev libxext-dev libasound2-dev libvulkan-dev
              bash scripts/build_linux.sh --ci
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: ${{ matrix.command }}

  required:
    name: All platform builds
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ always() }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Require success on every platform
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$BUILD_RESULT" != success ]]; then
            echo "At least one platform build did not succeed."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the version
        id: version
        run: python3 tools/ci_version.py

  release:
    name: Publish versioned source release
    runs-on: ubuntu-24.04
    needs: required
    if: ${{ needs.required.outputs.publish == 'true' }}
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.required.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Publish the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.required.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag has already been released."
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Luigi's Mansion 2 Recompiled $VERSION" --generate-notes

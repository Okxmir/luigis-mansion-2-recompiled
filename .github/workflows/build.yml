name: Build and release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2022
            command: ./scripts/build_ci_windows.ps1
          - platform: Linux x64
            runner: ubuntu-24.04
            command: |
              sudo apt-get update
              sudo apt-get install -y ninja-build pkg-config libssl-dev \
                libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxtst-dev \
                libxkbcommon-dev libwayland-dev libegl-dev libdecor-0-dev libasound2-dev libpulse-dev libvulkan-dev
              bash scripts/build_linux.sh --ci
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: ${{ matrix.command }}

  version:
    name: All platform builds
    runs-on: ubuntu-24.04
    needs: build
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the version
        id: version
        run: python3 tools/ci_version.py

  release:
    name: Publish versioned source release
    runs-on: ubuntu-24.04
    needs: version
    if: ${{ needs.version.outputs.publish == 'true' }}
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Publish the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag has already been released."
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Luigi's Mansion 2 Recompiled $VERSION" --generate-notes
